<script>
    // ==========================================
    // YOUR PHOTOS LIST FOR EACH MONTH
    // ==========================================
    const myPhotos = {
      1: [
        'IMG_6200.jpeg', 'IMG_6203.jpeg', 'IMG_6217.jpeg',
        'IMG_6256.jpeg', 'IMG_6333.jpeg', 'IMG_6340.jpeg',
        'IMG_6473.jpeg', 'IMG_6548.jpeg', 'IMG_6660.jpeg'
      ],
      2: [
        'IMG_7358.jpeg', 'IMG_7359.jpeg', 'IMG_7361.jpeg', 'IMG_7362.jpeg'
      ],
      3: [
        'IMG_0231.jpeg', 'IMG_0542.jpeg', 'IMG_0742.jpeg', 'IMG_1073.jpeg',
        'IMG_1291.jpeg', 'IMG_1311.jpeg', 'IMG_1347.jpeg', 'IMG_1422.jpeg'
      ],
      4: [
        'IMG_1482.jpeg', 'IMG_1578.jpeg', 'IMG_1744.jpeg', 'IMG_1839.jpeg',
        'IMG_1921.jpeg', 'IMG_1926.jpeg', 'IMG_2210.jpeg', 'IMG_2267.jpeg', 'IMG_2441.jpeg'
      ],
      5: [
        'IMG_2497.jpeg', 'IMG_2501.jpeg', 'IMG_3099.jpeg', 'IMG_3131.jpeg',
        'IMG_3161.jpeg', 'IMG_3213.jpeg', 'IMG_3226.jpeg', 'IMG_3324.jpeg', 'IMG_3353.jpeg'
      ],
      6: [], 7: [], 8: [], 9: [], 10: [], 11: [], 12: []
    };

    let activeMonth = 'All';

    function renderPhotos() {
      const grid = document.getElementById('photo-grid');
      grid.innerHTML = '';

      let photoList = [];
      if (activeMonth === 'All') {
        for (let m = 1; m <= 12; m++) {
          (myPhotos[m] || []).forEach(f => photoList.push({ month: m, file: f }));
        }
      } else {
        (myPhotos[activeMonth] || []).forEach(f => photoList.push({ month: activeMonth, file: f }));
      }

      if (photoList.length === 0) {
        grid.innerHTML = '<div class="loading-msg">No photos uploaded for this month yet!</div>';
        return;
      }

      photoList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        
        // If it's Month 5, pull directly from the main images folder where they were dropped
        if (item.month === 5) {
          img.src = `images/${item.file}`;
        } else {
          img.src = `images/month${item.month}/${item.file}`;
        }

        img.alt = "Memory";
        img.loading = "lazy";

        // Fallback for different image extensions
        img.onerror = function() {
          if (img.src.endsWith('.jpeg')) {
            img.src = img.src.replace('.jpeg', '.JPG');
          } else if (img.src.endsWith('.JPG')) {
            img.src = img.src.replace('.JPG', '.png');
          } else {
            card.style.display = 'none';
          }
        };

        card.appendChild(img);
        grid.appendChild(card);
      });
    }

    function switchMonth(monthNum, btnElement) {
      activeMonth = monthNum;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderPhotos();
    }

    function toggleAudio() {
      const audio = document.getElementById('bg-audio');
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    document.addEventListener('DOMContentLoaded', renderPhotos);
  </script>
