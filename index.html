<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baobei & Labidab 💖</title>
  
  <!-- Cute & Aesthetic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fff5f7;
      --card-bg: rgba(255, 255, 255, 0.92);
      --accent: #ff85a1;
      --accent-hover: #ff477e;
      --accent-soft: #ffe5ec;
      --text: #5c3d46;
      --text-light: #8c6874;
      --shadow: 0 8px 25px rgba(255, 133, 161, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#ffc2d1 0.8px, transparent 0.8px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 30px 15px 80px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Hearts Container */
    #hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -20px;
      font-size: 1.2rem;
      animation: floatUp 8s linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-105vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    .main-container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent-hover);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      border: 1px solid #ffccd5;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 3rem;
      margin: 5px 0 10px 0;
      color: var(--accent-hover);
      text-shadow: 1px 2px 0px rgba(255, 255, 255, 0.8);
    }

    /* Romantic Letter Card */
    .letter-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 30px 35px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      line-height: 1.8;
      font-size: 1rem;
      text-align: left;
      border: 2px solid #fff0f3;
      margin-bottom: 35px;
      position: relative;
    }

    .letter-card::before {
      content: '💌';
      position: absolute;
      top: -15px;
      right: 25px;
      font-size: 2rem;
      transform: rotate(12deg);
    }

    .letter-card p {
      margin-bottom: 16px;
    }

    .letter-card p.closing {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: var(--accent-hover);
      font-weight: 700;
      margin-bottom: 0;
      margin-top: 20px;
    }

    /* Month Navigation Tabs */
    .month-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 30px;
    }

    .tab-btn {
      background: #ffffff;
      color: var(--text-light);
      border: 1.5px solid #ffe0e6;
      padding: 9px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .tab-btn:hover, .tab-btn.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 133, 161, 0.35);
    }

    /* Pinterest Masonry Layout */
    .grid {
      column-count: 2;
      column-gap: 16px;
      width: 100%;
    }

    @media (min-width: 600px) {
      .grid {
        column-count: 3;
        column-gap: 20px;
      }
    }

    @media (min-width: 900px) {
      .grid {
        column-count: 4;
      }
    }

    .card {
      break-inside: avoid;
      margin-bottom: 20px;
      background: #ffffff;
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
      border: 1px solid #fff0f3;
      transition: all 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 25px rgba(255, 133, 161, 0.2);
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .loading-msg {
      text-align: center;
      font-style: italic;
      color: var(--text-light);
      grid-column: 1 / -1;
      padding: 40px;
      background: var(--card-bg);
      border-radius: 20px;
